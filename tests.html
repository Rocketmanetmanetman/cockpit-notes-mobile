<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tests — logique pure (core.js)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f3ede3;
        color: #26282a;
        margin: 0;
        padding: 20px;
        font-size: 15px;
      }
      h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
      #bilan { font-size: 18px; font-weight: 700; padding: 14px 16px; border-radius: 12px; }
      .vert { background: #7c9b86; color: #fff; }
      .rouge { background: #a24b42; color: #fff; }
      ul { list-style: none; padding: 0; }
      li { padding: 7px 10px; border-bottom: 1px solid rgba(38, 40, 42, 0.1); }
      li.ko { background: rgba(162, 75, 66, 0.12); font-weight: 600; }
      .detail { display: block; font-size: 13px; color: rgba(38, 40, 42, 0.6); }
    </style>
  </head>
  <body>
    <h1>Tests — logique pure</h1>
    <p>
      Ce harnais ne charge que <code>core.js</code> : ni stockage, ni interface, ni réseau.
      C'est ce qui rend le cœur vérifiable isolément.
    </p>
    <div id="bilan">…</div>
    <ul id="liste"></ul>

    <script src="./core.js"></script>
    <script>
      var resultats = [];

      function test(nom, fn) {
        try {
          fn();
          resultats.push({ nom: nom, ok: true });
        } catch (e) {
          resultats.push({ nom: nom, ok: false, detail: String((e && e.message) || e) });
        }
      }

      function egal(a, b, message) {
        var sa = JSON.stringify(a);
        var sb = JSON.stringify(b);
        if (sa !== sb) throw new Error((message || '') + ' — attendu ' + sb + ', obtenu ' + sa);
      }

      function vrai(v, message) {
        if (!v) throw new Error(message || 'attendu vrai');
      }

      // ---- Dates ----

      test('dateISO formate en AAAA-MM-JJ', function () {
        egal(Core.dateISO(new Date(2026, 6, 28)), '2026-07-28');
        egal(Core.dateISO(new Date(2026, 0, 3)), '2026-01-03');
      });

      test('horodatage formate en AAAA-MM-JJ HH:MM:SS', function () {
        egal(Core.horodatage(new Date(2026, 6, 28, 9, 5, 3)), '2026-07-28 09:05:03');
      });

      test('dateFr formate en JJ/MM/AAAA', function () {
        egal(Core.dateFr('2026-07-28'), '28/07/2026');
      });

      test('horodatageFr ajoute l\'heure quand elle est là', function () {
        egal(Core.horodatageFr('2026-07-28 09:05:03'), '28/07/2026 à 09:05');
        egal(Core.horodatageFr('2026-07-28'), '28/07/2026');
      });

      test('dateValide accepte une date réelle et refuse le reste', function () {
        vrai(Core.dateValide('2026-07-28'));
        vrai(Core.dateValide('2024-02-29'), 'année bissextile');
        vrai(!Core.dateValide('2026-02-29'), 'le 29 février n\'existe pas en 2026');
        vrai(!Core.dateValide('2026-13-01'));
        vrai(!Core.dateValide('28/07/2026'));
        vrai(!Core.dateValide(''));
        vrai(!Core.dateValide(null));
      });

      test('grilleMois rend 42 cases, lundi en tête', function () {
        var cases = Core.grilleMois(2026, 6); // juillet 2026, le 1er est un mercredi
        egal(cases.length, 42);
        egal(cases[0].iso, '2026-06-29', 'la grille commence au lundi précédent');
        vrai(cases[0].horsMois);
        var premierDuMois = cases.filter(function (c) { return c.iso === '2026-07-01'; })[0];
        vrai(premierDuMois && !premierDuMois.horsMois);
      });

      // ---- UUID et nom de lot ----

      test('uuid produit des identifiants distincts et bien formés', function () {
        var a = Core.uuid();
        var b = Core.uuid();
        vrai(a !== b, 'deux UUID successifs diffèrent');
        vrai(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(a), a);
      });

      test('lotFilename respecte le contrat de nommage', function () {
        var nom = Core.lotFilename('a1b2c3d4-0000-4000-8000-000000000000', new Date(2026, 6, 28, 9, 30, 5));
        egal(nom, 'lot 2026-07-28 09h30m05 a1b2c3.json');
      });

      test('l\'ordre alphabétique des noms de lots est chronologique', function () {
        var d1 = new Date(2026, 6, 27, 23, 59, 59);
        var d2 = new Date(2026, 6, 28, 0, 0, 0);
        var n1 = Core.lotFilename('ffffff00-0000-4000-8000-000000000000', d1);
        var n2 = Core.lotFilename('00000000-0000-4000-8000-000000000000', d2);
        vrai(n1 < n2, n1 + ' doit précéder ' + n2);
      });

      test('lotFilename complète un UUID trop court sans jamais casser', function () {
        egal(Core.lotFilename('ab', new Date(2026, 6, 28, 1, 2, 3)), 'lot 2026-07-28 01h02m03 ab0000.json');
      });

      // ---- Le lot ----

      test('buildLot ne recopie QUE les champs du contrat', function () {
        var lot = Core.buildLot(
          [{ uuid: 'u1', texte: 'a', date: '2026-07-28', cible: 'proj:3', cible_nom: 'Musique', cree_le: '2026-07-28 09:30:12', seq: 42, envoyee: false }],
          'lot-uuid',
          '2026-07-28 10:00:00'
        );
        egal(lot.format, 'cockpit-notes-lot');
        egal(lot.version, 1);
        egal(lot.lot, 'lot-uuid');
        egal(lot.genere_le, '2026-07-28 10:00:00');
        egal(Object.keys(lot.notes[0]).sort(), ['cible', 'cible_nom', 'cree_le', 'date', 'texte', 'uuid']);
        vrai(lot.notes[0].seq === undefined, 'le compteur de tri ne fuite jamais dans le lot');
      });

      test('buildLot normalise une orpheline en cible nulle', function () {
        var lot = Core.buildLot([{ uuid: 'u1', texte: 'a', date: '2026-07-28' }], 'l', 'g');
        egal(lot.notes[0].cible, null);
        egal(lot.notes[0].cible_nom, '');
        egal(lot.notes[0].cree_le, null);
      });

      test('buildLot accepte une file vide', function () {
        egal(Core.buildLot([], 'l', 'g').notes, []);
      });

      test('lotJson produit du JSON indenté relisible', function () {
        var lot = Core.buildLot([{ uuid: 'u1', texte: 'ligne\nsuite', date: '2026-07-28' }], 'l', 'g');
        var texte = Core.lotJson(lot);
        vrai(texte.indexOf('\n  ') >= 0, 'indenté');
        egal(JSON.parse(texte).notes[0].texte, 'ligne\nsuite', 'les sauts de ligne survivent');
      });

      test('le séparateur voyage tel quel dans le lot', function () {
        var texte = 'avant\n' + Core.SEPARATEUR + '\naprès';
        var lot = Core.buildLot([{ uuid: 'u1', texte: texte, date: '2026-07-28' }], 'l', 'g');
        egal(JSON.parse(Core.lotJson(lot)).notes[0].texte, texte);
      });

      // ---- Les référentiels ----

      function refProjets(version) {
        return JSON.stringify({
          format: 'cockpit-projets',
          version: version === undefined ? 1 : version,
          genere_le: '2026-07-28 12:00:00',
          projets: [{ cle: 'proj:1', nom: 'Musique', couleur: '#7C9B86' }],
        });
      }

      test('parseReferentiel reconnaît SEUL projets.json', function () {
        var r = Core.parseReferentiel(refProjets());
        vrai(r.ok);
        egal(r.genre, 'projets');
        egal(r.genere_le, '2026-07-28 12:00:00');
        egal(r.projets[0].nom, 'Musique');
      });

      test('parseReferentiel reconnaît SEUL backlogs.json', function () {
        var r = Core.parseReferentiel(JSON.stringify({
          format: 'cockpit-backlogs',
          version: 1,
          genere_le: '2026-07-28 12:00:00',
          projets: [{ cle: 'proj:1', nom: 'Musique', colonnes: [{ libelle: 'RDV', tickets: [] }] }],
        }));
        vrai(r.ok);
        egal(r.genre, 'backlogs');
        egal(r.projets[0].colonnes[0].libelle, 'RDV');
      });

      test('une version inconnue est refusée proprement', function () {
        var r = Core.parseReferentiel(refProjets(9));
        vrai(!r.ok);
        vrai(r.versionInconnue);
        vrai(r.erreur.indexOf('version') >= 0, r.erreur);
      });

      test('un JSON invalide ou un format étranger est refusé sans exception', function () {
        vrai(!Core.parseReferentiel('{pas du json').ok);
        vrai(!Core.parseReferentiel(JSON.stringify({ format: 'cadrage-cibles', version: 1 })).ok);
        vrai(!Core.parseReferentiel('null').ok);
      });

      test('les champs inconnus d\'un référentiel sont ignorés', function () {
        var r = Core.parseReferentiel(JSON.stringify({
          format: 'cockpit-projets',
          version: 1,
          genere_le: 'g',
          nouveaute: 42,
          projets: [{ cle: 'proj:1', nom: 'M', couleur: '#000', futur: true }],
        }));
        vrai(r.ok);
        egal(r.projets[0].nom, 'M');
      });

      test('un référentiel sans liste ne fait jamais échouer la lecture', function () {
        var r = Core.parseReferentiel(JSON.stringify({ format: 'cockpit-projets', version: 1 }));
        vrai(r.ok);
        egal(r.projets, []);
      });

      // ---- Le corps d'une note ----

      test('la première ligne sert de titre', function () {
        egal(Core.titreNote('Idée de refrain\nsuite'), 'Idée de refrain');
        egal(Core.titreNote('\n\n  Après des blancs  '), 'Après des blancs');
        egal(Core.titreNote(''), '(note vide)');
      });

      test('le séparateur n\'est jamais un titre', function () {
        egal(Core.titreNote(Core.SEPARATEUR + '\nvrai titre'), 'vrai titre');
      });

      test('un titre très long est tronqué à l\'affichage', function () {
        var titre = Core.titreNote(new Array(200).join('a'));
        vrai(titre.length <= 71, titre.length + ' caractères');
      });

      test('l\'aperçu montre la suite, sans le titre ni les traits', function () {
        egal(Core.apercuNote('titre\n' + Core.SEPARATEUR + '\nsuite\nfin'), 'suite · fin');
        egal(Core.apercuNote('titre seul'), '');
      });

      test('une note vide est reconnue, séparateurs seuls compris', function () {
        vrai(Core.noteVide(''));
        vrai(Core.noteVide('   \n\n  '));
        vrai(Core.noteVide(Core.SEPARATEUR));
        vrai(!Core.noteVide('a'));
        vrai(!Core.noteVide(Core.SEPARATEUR + '\nquelque chose'));
      });

      test('estSeparateur tolère un trait raccourci', function () {
        vrai(Core.estSeparateur(Core.SEPARATEUR));
        vrai(Core.estSeparateur('--------'));
        vrai(!Core.estSeparateur('---'));
        vrai(!Core.estSeparateur('- a -'));
      });

      // ---- Notes typées (SPEC du 06-08-2026) : le lot v2 ----

      function noteLibre(uuid) {
        return { uuid: uuid, texte: 'libre', date: '2026-08-06', cible: null, cible_nom: '', cree_le: null };
      }

      test('un lot tout-libre reste en version 1', function () {
        var lot = Core.buildLot([noteLibre('a'), noteLibre('b')], 'u', 'g');
        egal(lot.version, 1);
        vrai(!('genre' in lot.notes[0]), 'aucun champ genre sur une note libre');
      });

      test('un lot passe en version 2 dès qu\'une note est typée, genre et charge à bord', function () {
        var ticket = {
          uuid: 't', texte: 'Mixer', date: '2026-08-06', cible: 'proj:1', cible_nom: 'Musique',
          cree_le: null, genre: 'ticket', charge: { titre: 'Mixer', colonne_id: 4 },
          seq: 12,
        };
        var lot = Core.buildLot([noteLibre('a'), ticket], 'u', 'g');
        egal(lot.version, 2);
        egal(lot.notes[1].genre, 'ticket');
        egal(lot.notes[1].charge.colonne_id, 4);
        vrai(!('seq' in lot.notes[1]), 'seq ne fuite jamais dans le lot');
        vrai(!('genre' in lot.notes[0]), 'la note libre du même lot reste nue');
      });

      // ---- Notes typées : la fiche Ticket ----

      test('l\'heure maison replie ce qui se tape au pouce et refuse ce qui n\'a pas de sens', function () {
        // Audit du 07-08-2026 : exiger « HH:MM » rendait le rendez-vous insaisissable sur
        // un pavé numérique sans « : ». On replie, le contrat reçoit toujours HH:MM.
        egal(Core.heureNormalisee('09:30'), '09:30');
        egal(Core.heureNormalisee('9:30'), '09:30');
        egal(Core.heureNormalisee('0930'), '09:30');
        egal(Core.heureNormalisee('930'), '09:30');
        egal(Core.heureNormalisee('9h30'), '09:30');
        egal(Core.heureNormalisee('9 h 30'), '09:30');
        egal(Core.heureNormalisee('9'), '09:00');
        egal(Core.heureNormalisee('23:59'), '23:59');
        egal(Core.heureNormalisee('0000'), '00:00');
        // Ce qui n'a pas de sens reste refusé.
        egal(Core.heureNormalisee('24:00'), '');
        egal(Core.heureNormalisee('12:75'), '');
        egal(Core.heureNormalisee(''), '');
        egal(Core.heureNormalisee('12345'), '');
        vrai(Core.heureValide('930'));
        vrai(!Core.heureValide('24:00'));
      });

      test('la charge d\'un rendez-vous replie l\'heure tapée à la main', function () {
        var f = Core.ficheVierge();
        f.titre = 'Studio';
        f.rdv = true;
        f.date_valeur = '2026-08-20';
        f.heure = '9h30';
        egal(Core.chargeTicket(f).date_valeur, '2026-08-20 09:30');
      });

      test('un ticket exige un titre, et une colonne ou un rendez-vous', function () {
        var f = Core.ficheVierge();
        vrai(Core.validerFicheTicket(f).indexOf('titre') >= 0);
        f.titre = 'Mixer';
        vrai(Core.validerFicheTicket(f).indexOf('colonne') >= 0);
        f.colonne_id = 4;
        egal(Core.validerFicheTicket(f), null);
      });

      test('un rendez-vous exige date ET heure — l\'invariant du Cockpit', function () {
        var f = Core.ficheVierge();
        f.titre = 'Studio';
        f.rdv = true;
        vrai(Core.validerFicheTicket(f) !== null);
        f.date_valeur = '2026-08-20';
        vrai(Core.validerFicheTicket(f) !== null, 'la date seule ne suffit pas');
        f.heure = '09:30';
        egal(Core.validerFicheTicket(f), null);
      });

      test('la charge d\'un ticket est conforme au contrat, échéance comme rendez-vous', function () {
        var f = Core.ficheVierge();
        f.titre = ' Mixer ';
        f.colonne_id = 4;
        f.colonne_libelle = 'En cours';
        f.date_valeur = '2026-08-12';
        f.rappel_home = true;
        f.liens = [{ libelle: 'Doc', url: 'https://exemple.fr' }, { libelle: 'vide', url: '  ' }];
        var c = Core.chargeTicket(f);
        egal(c.titre, 'Mixer');
        egal(c.date_nature, 'echeance');
        egal(c.date_valeur, '2026-08-12');
        egal(c.liens.length, 1, 'un lien sans URL n\'existe pas');
        f.rdv = true;
        f.heure = '09:30';
        c = Core.chargeTicket(f);
        egal(c.colonne_id, null, 'un rendez-vous vit hors colonne');
        egal(c.date_nature, 'rdv');
        egal(c.date_valeur, '2026-08-12 09:30');
      });

      test('sans échéance choisie, la charge n\'a ni nature ni valeur de date', function () {
        var f = Core.ficheVierge();
        f.titre = 'Simple';
        f.colonne_id = 2;
        var c = Core.chargeTicket(f);
        egal(c.date_nature, null);
        egal(c.date_valeur, null);
      });

      // ---- Notes typées : la fiche Idée ----

      test('une idée exige un titre et une catégorie', function () {
        var f = Core.ficheVierge();
        vrai(Core.validerFicheIdee(f).indexOf('titre') >= 0);
        f.titre = 'Clip';
        vrai(Core.validerFicheIdee(f).indexOf('catégorie') >= 0);
        f.categorie_id = 7;
        egal(Core.validerFicheIdee(f), null);
      });

      test('la charge d\'une idée normalise maturité et position', function () {
        var f = Core.ficheVierge();
        f.titre = 'Clip';
        f.categorie_id = 7;
        f.maturite = 'nimporte';
        f.position = 'haut';
        f.coup_de_coeur = true;
        var c = Core.chargeIdee(f);
        egal(c.maturite, 'brut', 'une maturité inconnue retombe sur brut');
        egal(c.position, 'haut');
        egal(c.coup_de_coeur, true);
      });

      // ---- Notes typées : le texte aplati et l'aller-retour de la fiche ----

      test('le texte aplati porte titre, description et liens (D13)', function () {
        var f = Core.ficheVierge();
        f.titre = 'Mixer';
        f.description = 'Le refrain';
        f.liens = [{ libelle: 'Doc', url: 'https://exemple.fr' }, { libelle: '', url: 'https://a.fr' }];
        egal(Core.texteDe(f), 'Mixer\n\nLe refrain\n\nDoc — https://exemple.fr\nhttps://a.fr');
        var court = Core.ficheVierge();
        court.titre = 'Seul';
        egal(Core.texteDe(court), 'Seul');
      });

      test('ficheDepuisCharge rouvre le bon formulaire, rendez-vous découpé', function () {
        var f = Core.ficheDepuisCharge('ticket', {
          titre: 'Studio', description: 'd', date_nature: 'rdv', date_valeur: '2026-08-20 09:30',
          rappel_home: true, position: 'haut', liens: [{ libelle: 'x', url: 'https://x.fr' }],
        });
        vrai(f.rdv);
        egal(f.date_valeur, '2026-08-20');
        egal(f.heure, '09:30');
        egal(f.position, 'haut');
        egal(f.liens.length, 1);
        var i = Core.ficheDepuisCharge('idee', { titre: 'Clip', categorie_id: 7, maturite: 'creuser', coup_de_coeur: true });
        egal(i.categorie_id, 7);
        egal(i.maturite, 'creuser');
        vrai(i.coup_de_coeur);
        egal(Core.ficheDepuisCharge('ticket', null).titre, '', 'charge bancale : fiche vierge, jamais une erreur');
      });

      // ---- Notes typées : ce que le référentiel permet (§4.6) ----

      test('colonnesCiblables exige les ids — un vieil instantané rend une liste vide', function () {
        var vieux = { colonnes: [{ libelle: 'RDV', systeme: true }, { libelle: 'En cours' }] };
        egal(Core.colonnesCiblables(vieux), []);
        var neuf = {
          colonnes: [
            { libelle: 'RDV', systeme: true },
            { id: 4, libelle: 'En cours', terminale: false },
            { id: 5, libelle: 'Fait', terminale: true },
          ],
        };
        egal(Core.colonnesCiblables(neuf).length, 2, 'la pseudo-colonne RDV est exclue');
        egal(Core.colonnesCiblables(null), []);
      });

      test('categoriesDe distingue « instantané d\'avant » (null) et « aucune catégorie » ([])', function () {
        egal(Core.categoriesDe({ colonnes: [] }), null);
        egal(Core.categoriesDe({ categories: [] }), []);
        egal(Core.categoriesDe({ categories: [{ id: 1, libelle: 'Concepts', idees: [] }] }).length, 1);
      });

      // ---- Texte riche des descriptions venues du PC (15-08-2026) ----

      test('htmlTexteRiche : le gras, l\'italique et le surlignage deviennent des balises', function () {
        egal(Core.htmlTexteRiche('**a**'), '<p class="tr-p"><strong>a</strong></p>');
        egal(Core.htmlTexteRiche('__a__'), '<p class="tr-p"><em>a</em></p>');
        egal(Core.htmlTexteRiche('==a=='), '<p class="tr-p"><mark>a</mark></p>');
      });

      test('htmlTexteRiche : les marqueurs s\'imbriquent', function () {
        egal(
          Core.htmlTexteRiche('==**__a__**=='),
          '<p class="tr-p"><mark><strong><em>a</em></strong></mark></p>',
        );
      });

      test('htmlTexteRiche : un marqueur sans fermeture reste du texte', function () {
        egal(Core.htmlTexteRiche('2 ** 3'), '<p class="tr-p">2 ** 3</p>');
      });

      test('htmlTexteRiche : le HTML du texte est ÉCHAPPÉ', function () {
        // ⚠️ « </scr'+'ipt> » coupé en deux : écrit d'un bloc, il fermerait CE bloc de
        // script et le harnais entier tomberait en erreur de syntaxe.
        var dangereux = '<scr' + 'ipt>x</scr' + 'ipt>';
        egal(
          Core.htmlTexteRiche(dangereux),
          '<p class="tr-p">&lt;scr' + 'ipt&gt;x&lt;/scr' + 'ipt&gt;</p>',
        );
        egal(Core.htmlTexteRiche('**<b>**'), '<p class="tr-p"><strong>&lt;b&gt;</strong></p>');
      });

      test('htmlTexteRiche : les puces s\'imbriquent sur six niveaux', function () {
        var html = Core.htmlTexteRiche('• a\n  ◦ b\n    ▪ c\n      • d\n        ◦ e\n          ▪ f');
        egal((html.match(/<ul/g) || []).length, 6, 'six listes imbriquées');
        egal((html.match(/<li/g) || []).length, 6, 'six éléments');
        egal((html.match(/<\/ul>/g) || []).length, 6, 'toutes refermées');
      });

      test('htmlTexteRiche : la liste se referme sur une ligne ordinaire', function () {
        egal(
          Core.htmlTexteRiche('• a\nfin'),
          '<ul class="tr-liste"><li class="tr-item">a</li></ul><p class="tr-p">fin</p>',
        );
      });

      test('htmlTexteRiche : le séparateur du téléphone devient un trait', function () {
        egal(Core.htmlTexteRiche(Core.SEPARATEUR), '<hr class="tr-trait">');
      });

      test('htmlTexteRiche : une description vide ne rend qu\'une ligne vide', function () {
        // Le <br> n'est pas décoratif : sans lui, le bloc vide n'a pas de hauteur et le
        // curseur n'a nulle part où se poser quand on ÉDITE. Un seul chemin de rendu sert
        // la lecture et l'édition, donc il est là des deux côtés.
        egal(Core.htmlTexteRiche(''), '<p class="tr-p"><br></p>');
        egal(Core.htmlTexteRiche(null), '<p class="tr-p"><br></p>');
      });

      // ---- Le modèle et les gestes du champ riche (15-08-2026, écriture sur le téléphone) ----
      //
      // ⚠️ Portage de `src/pages/projet/texteRiche.ts`. Ces tests sont le garde-fou contre
      // la divergence : ils reprennent les cas du banc du PC (`banc_texte_riche.cjs`).

      function P(ligne, plat) { return { ligne: ligne, plat: plat }; }
      function jouer(texte, geste) {
        var lignes = Core.lireModeleRiche(texte);
        var suite = geste(lignes);
